name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # One shared copy of the speech models, cached between runs.
      UNCLE_VIRGIL_MODELS: ${{ github.workspace }}/ci-models
      UNCLE_VIRGIL_TEST_MODELS: ${{ github.workspace }}/ci-models
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Linux audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Cache speech models
        uses: actions/cache@v5
        with:
          path: ci-models
          key: speech-models-parakeet-v1

      - name: Download speech models
        run: python -m uncle_virgil --download-models --home ci-home

      - name: Test
        run: python -m pytest -v -rs

      - name: Open the real window and check the interface loads
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -m uncle_virgil --self-test --home ci-home

  build-windows:
    name: Standalone Windows build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNCLE_VIRGIL_MODELS: ${{ github.workspace }}/ci-models
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        shell: pwsh
        run: .\packaging\build-windows.ps1

      - name: Cache speech models
        uses: actions/cache@v5
        with:
          path: ci-models
          key: speech-models-parakeet-v1

      - name: Run the built app's self-test (window, service, speech engine)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Uncle Virgil\Uncle Virgil.exe" -ArgumentList "--self-test","--home","ci-home" -Wait -PassThru
          Get-Content ci-home\uncle-virgil.log | Select-String "Self-test"
          if ($p.ExitCode -ne 0) { Get-Content ci-home\uncle-virgil.log; throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Self-test a copy marked as downloaded from the internet, as unzipping a download does
        shell: pwsh
        run: |
          Copy-Item -Recurse "dist\Uncle Virgil" "downloaded\Uncle Virgil"
          Get-ChildItem -Recurse -File "downloaded" | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $p = Start-Process -FilePath "downloaded\Uncle Virgil\Uncle Virgil.exe" -ArgumentList "--self-test","--home","ci-home-downloaded" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "the downloaded copy did not finish its self-test (a dialog may be waiting)" }
          Get-Content ci-home-downloaded\uncle-virgil.log -ErrorAction SilentlyContinue | Select-String "Self-test|ERROR|Error|Failed"
          if ($p.ExitCode -ne 0) { Get-Content ci-home-downloaded\uncle-virgil.log -ErrorAction SilentlyContinue; throw "self-test of the downloaded copy failed with exit code $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist\Uncle Virgil" -DestinationPath "Uncle-Virgil-windows.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: Uncle-Virgil-windows
          path: Uncle-Virgil-windows.zip
          retention-days: 30
